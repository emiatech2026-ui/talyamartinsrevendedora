    <script>
      // Sanitização Universal Anti-XSS (mandatório pelo Prompt Mestre)
      window.escapeHTML = function(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
          tag => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              "'": '&#39;',
              '"': '&quot;'
            }[tag] || tag)
        );
      };
      window.sanitizeUrl = function(url) {
        if (!url) return '';
        if (url.trim().toLowerCase().startsWith('javascript:')) return 'about:blank';
        return url;
      };
    </script>
